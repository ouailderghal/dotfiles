# ~/.config/kitty/kitty.conf
# vim: ft=config

# Theme (dark is the default; ctrl+shift+f1 = dark, ctrl+shift+f2 = light)
include light.conf

# General
term xterm-kitty
shell /bin/zsh
shell_integration enabled no-cursor
copy_on_select yes
scrollback_lines 10000
sync_to_monitor yes
enable_audio_bell no
enable_visual_bell no
allow_remote_control socket-only

# Tabs & layouts
tab_bar_edge top
tab_bar_style separator
tab_powerline_style slanted
enabled_layouts stack

# Cursor
cursor_shape block
cursor_blink_interval 0

# Font
font_family family="Hack Nerd Font Mono"
bold_font auto
italic_font auto
bold_italic_font auto
font_size 10.0
disable_ligatures always

# Theme switching
map ctrl+shift+f1 set_colors --configured ~/.config/kitty/dark.conf
map ctrl+shift+f2 set_colors --configured ~/.config/kitty/light.conf

# Font size
map ctrl+shift+k change_font_size current +1.0
map ctrl+shift+j change_font_size current -1.0
map ctrl+shift+backspace change_font_size current 0

# URLs
url_style curly
open_url_with default
detect_urls yes

# Disable defaults
map ctrl+shift+enter no_op
map ctrl+shift+r no_op
map ctrl+shift+space no_op
map ctrl+shift+l no_op
map ctrl+shift+equal no_op
map alt+left no_op
map alt+right no_op
map alt+shift+left no_op
map alt+shift+right no_op
map ctrl+t no_op

# Windows
map ctrl+shift+n new_os_window_with_cwd

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+alt+t set_tab_title

# URLs & hints
map ctrl+shift+e open_url_with_hints
map ctrl+shift+p>f kitten hints --type path --program -
